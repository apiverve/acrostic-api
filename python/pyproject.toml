[project]
name = "apiverve-acrosticpuzzlegenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Acrostic Puzzle Generator creates puzzles where the first letters of answer words spell out a hidden keyword."
keywords = ["acrostic", "word puzzle", "hidden word", "first letters", "vocabulary"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/acrostic?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/acrostic?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/acrostic-api"
Twitter = "https://twitter.com/apivervehq"
